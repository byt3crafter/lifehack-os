<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Life Hack OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0c0c0e;
            font-family: 'DM Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #f0f0f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Subtle background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(79,128,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,128,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .container { width: 100%; max-width: 360px; position: relative; }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f80ff, #22c55e);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 0 32px rgba(79,128,255,0.25);
        }
        .brand h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f0f0f2;
            letter-spacing: -0.02em;
        }
        .brand p {
            font-size: 0.8125rem;
            color: #5c5c6b;
            margin-top: 0.25rem;
        }

        .card {
            background: #141416;
            border: 1px solid #2a2a2e;
            border-radius: 16px;
            padding: 1.75rem;
        }

        .error-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.8125rem;
            margin-bottom: 1.25rem;
        }

        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #9898a6;
            margin-bottom: 0.5rem;
        }
        .field input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0c0c0e;
            border: 1px solid #2a2a2e;
            border-radius: 10px;
            color: #f0f0f2;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.9375rem;
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }
        .field input:focus {
            border-color: #4f80ff;
            box-shadow: 0 0 0 3px rgba(79,128,255,0.15);
        }
        .field input::placeholder { color: #3a3a48; }
        .field input.input-error {
            border-color: rgba(239,68,68,0.5);
        }
        .field input.input-error:focus {
            border-color: rgba(239,68,68,0.7);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }

        .inline-error {
            font-size: 0.75rem;
            color: #fca5a5;
            margin-top: 0.375rem;
            display: none;
        }
        .inline-error.visible { display: block; }

        .submit-btn {
            width: 100%;
            padding: 0.8125rem;
            background: #4f80ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .submit-btn:hover { background: #6b96ff; }
        .submit-btn:active { transform: scale(0.98); }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #3a3a48;
            margin-top: 1.5rem;
            letter-spacing: 0.04em;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: #5c5c6b;
        }
        .back-link a {
            color: #4f80ff;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover { color: #6b96ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-mark">
                <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1>Life Hack OS</h1>
            <p>Personal Operating System</p>
        </div>

        <div class="card">
            {% if error %}
            <div class="error-banner">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/reset-password" id="reset-form" novalidate>
                <input type="hidden" name="token" value="{{ token }}">

                <div class="field">
                    <label for="new_password">New password</label>
                    <input type="password" id="new_password" name="new_password" required autofocus
                           autocomplete="new-password" placeholder="••••••••">
                </div>

                <div class="field" style="margin-bottom:1.5rem;">
                    <label for="confirm_password">Confirm new password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                           autocomplete="new-password" placeholder="••••••••">
                    <p class="inline-error" id="password-mismatch" role="alert">Passwords do not match.</p>
                </div>

                <button type="submit" class="submit-btn">Reset Password</button>
            </form>
        </div>

        <p class="back-link"><a href="/login">Back to sign in</a></p>
        <p class="footer" style="margin-top:1rem;">Discipline &middot; Clarity &middot; Progress</p>
    </div>

    <script>
        const form = document.getElementById('reset-form');
        const newPasswordInput = document.getElementById('new_password');
        const confirmInput = document.getElementById('confirm_password');
        const mismatchMsg = document.getElementById('password-mismatch');

        function checkMatch() {
            const mismatch = confirmInput.value.length > 0 && newPasswordInput.value !== confirmInput.value;
            mismatchMsg.classList.toggle('visible', mismatch);
            confirmInput.classList.toggle('input-error', mismatch);
        }

        newPasswordInput.addEventListener('input', checkMatch);
        confirmInput.addEventListener('input', checkMatch);

        form.addEventListener('submit', function (e) {
            if (newPasswordInput.value !== confirmInput.value) {
                e.preventDefault();
                mismatchMsg.classList.add('visible');
                confirmInput.classList.add('input-error');
                confirmInput.focus();
            }
        });
    </script>
</body>
</html>
