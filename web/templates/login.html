<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Life Hack OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: { primary: '#0f0f0f', secondary: '#1a1a1a', card: '#242424' },
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #0f0f0f; font-family: 'Inter', system-ui, sans-serif; }
        input { background: #1a1a1a !important; }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-4xl mb-2">⚡</div>
            <h1 class="text-2xl font-bold">Life Hack OS</h1>
            <p class="text-gray-400 text-sm mt-1">Personal Operating System</p>
        </div>
        
        <form method="POST" class="bg-bg-card rounded-xl p-6 border border-gray-800">
            {% if error %}
            <div class="bg-red-500/20 border border-red-500/50 text-red-300 px-4 py-3 rounded-lg mb-4 text-sm">
                {{ error }}
            </div>
            {% endif %}
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Username</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-4 py-3 rounded-lg border border-gray-700 text-white focus:border-accent focus:outline-none transition"
                    placeholder="Enter username">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-700 text-white focus:border-accent focus:outline-none transition"
                    placeholder="Enter password">
            </div>
            
            <button type="submit" 
                class="w-full bg-accent hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition">
                Sign In
            </button>
        </form>
        
        <p class="text-center text-gray-600 text-xs mt-6">
            Discipline. Clarity. Progress.
        </p>
    </div>
</body>
</html>
